name: 🚀 Ivory

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kernel_branch: [Ivory, Ivory2]
    env:
      PROJECT_NAME: KSU-Kinesis

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 🧰 Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git bison flex libxml2 libssl-dev bc zip default-jre python3 python3-pip wget curl cpio bash ccache jq

      - name: 💬 Send Start Notification
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          chmod +x ivory.sh
          ./ivory.sh tg_start


      - name: 🛠️ Build Kernel (${{ matrix.kernel_branch }})
        id: build
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KERNEL_BRANCH: ${{ matrix.kernel_branch }}
        run: |
          chmod +x ivory.sh
          ./ivory.sh

      - name: 💬 Send Completion/Error Notifications (Handled in Script)
        if: always() # Run regardless of success or failure
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: echo "Notifications handled within ivory.sh"
