name: 🚀 QLLVM

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: KSU-Kinesis

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3

      - name: 🧰 Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 💾 Cache APT packages
        uses: actions/cache@v3
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Kinesis15.sh') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: 📦 Install Dependencies
        run: |
          echo "🧰 Installing required packages..."
          sudo apt update
          sudo apt install -y git bison flex libxml2 libssl-dev bc zip default-jre python3 python3-pip wget curl cpio bash ccache jq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev
          echo "✅ Dependencies installed successfully!"

      - name: 💾 Cache ccache
        uses: actions/cache@v3
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 💾 Cache LLVM Toolchain
        uses: actions/cache@v3
        with:
          path: ~/AzyrRuthless-LLVM
          key: ${{ runner.os }}-llvm-toolchain-${{ hashFiles('**/Kinesis15.sh') }}
          restore-keys: |
            ${{ runner.os }}-llvm-toolchain-

      - name: 🛠️ Build Kernel
        id: build
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KERNEL_SOURCE: https://github.com/AzyrRuthless/kernel_xiaomi_sm6250
          KERNEL_BRANCH: Sigma
        run: |
          echo "🚀 Starting the kernel build process..."
          bash qllvm.sh
          echo "🎉 Kernel build completed!"

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KSU-Kinesis-artifacts-Clang-${{ github.run_id }}
          path: ${{ steps.build.outputs.artifact_dir }}

      - name: 📤 Upload Build Log (Always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-Clang-${{ github.run_id }}
          path: ${{ steps.build.outputs.artifact_dir }}/build.log
