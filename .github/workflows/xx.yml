name: 🚀 CLMP Build

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Compiler Toolchain'
        required: true
        type: choice
        default: 'AOSP Clang'
        options:
          - 'AOSP Clang'
          - 'Neutron Clang'
      clean_build:
        description: 'Clean Build (Wipe Ccache)'
        required: false
        type: boolean
        default: false
      analysis_target:
        description: 'W=1 Static Analysis Target'
        required: false
        type: choice
        default: 'None'
        options:
          - 'None'
          - 'Power (drivers/power/supply)'
          - 'Display (drivers/gpu/drm/msm)'
          - 'Camera (drivers/media/platform/msm/camera_v2)'
          - 'Input (drivers/input)'
          - 'Audio (techpack/audio)'
          - 'Sched/CPU (kernel/sched drivers/cpufreq)'
          - 'Full Kernel'
      upload_artifact:
        description: 'Upload Artifact to GitHub'
        required: false
        type: boolean
        default: false

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: CLMP
      CLANG_VERSION: r596125
      CLANG_PATH: tools
      TOOLCHAIN: ${{ inputs.toolchain }}
      CLEAN_BUILD: ${{ inputs.clean_build }}
      ANALYSIS_TARGET: ${{ inputs.analysis_target }}

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6.0.2

      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git bison flex libxml2-dev libssl-dev bc zip default-jre \
            python3 python3-pip wget curl aria2 axel zstd cpio bash ccache jq \
            libncurses-dev lld build-essential libstdc++6 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: 💽 Configure swap from free disk
        run: |
          sudo swapoff -a
          FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
          SWAP_KB=$(( FREE_KB > 1048576 ? FREE_KB - 1048576 : 0 ))
          if [[ $SWAP_KB -gt 524288 ]]; then
            echo "Creating $((SWAP_KB / 1024)) MB swap..."
            if ! sudo fallocate -l "${SWAP_KB}K" /swapfile 2>/dev/null; then
              sudo dd if=/dev/zero of=/swapfile bs=1M \
                count=$((SWAP_KB / 1024)) status=none
            fi
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            sudo sysctl -q vm.swappiness=10
          else
            echo "Insufficient free space for swap"
          fi
          swapon --show
          free -h

      - name: 💾 Cache Toolchain & Ccache
        id: cache-env
        uses: actions/cache@v5.0.5
        with:
          path: |
            /tmp/ccache
            ${{ github.workspace }}/${{ env.CLANG_PATH }}
            /home/runner/.neutron-tc
          key: ${{ runner.os }}-${{ inputs.toolchain }}-${{ env.CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.toolchain }}-${{ env.CLANG_VERSION }}-

      - name: 🛠️ Build kernel
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GL_DEPLOY_USER: ${{ secrets.GL_DEPLOY_USER }}
          GL_DEPLOY_TOKEN: ${{ secrets.GL_DEPLOY_TOKEN }}
          KERNEL_REPO_URL: ${{ secrets.KERNEL_REPO_URL }}
          KERNEL_BRANCH: NadirCLMP
        run: |
          #!/bin/bash
          set -euo pipefail

          readonly WORKSPACE="${GITHUB_WORKSPACE:-$(pwd)}"
          readonly KERNEL_DIR="$WORKSPACE/Kinesis_Kernel"
          readonly TOOLS_DIR="$WORKSPACE/tools"
          readonly CLANG_DIR="$TOOLS_DIR/clang-$CLANG_VERSION"
          readonly NEUTRON_DIR="$TOOLS_DIR/neutron-clang"
          readonly DEFCONFIG="vendor/xiaomi/miatoll_defconfig"
          readonly ANYKERNEL_BRANCH="Ivory"

          function cleanup() {
              rm -f ~/.netrc
              if [[ -n "${MONITOR_PID:-}" ]]; then
                  kill "$MONITOR_PID" 2>/dev/null || true
              fi
          }
          trap cleanup EXIT

          tg_send() {
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  -d text="$1" \
                  -d parse_mode="HTML" || true
          }

          tg_edit() {
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/editMessageText" \
                  -d chat_id="$TELEGRAM_CHAT_ID" \
                  -d message_id="$1" \
                  -d text="$2" \
                  -d parse_mode="HTML" >/dev/null || true
          }

          tg_doc() {
              local file="$1" caption="$2"
              [[ -f "$file" ]] || { echo "File not found: $file"; return 1; }
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                  -F chat_id="$TELEGRAM_CHAT_ID" \
                  -F document="@$file" \
                  -F caption="$caption" \
                  -F parse_mode="HTML" >/dev/null || true
          }

          start_monitor() {
              local msg_id="$1"
              local start_time="$2"

              while true; do
                  sleep 30
                  local current_time
                  current_time=$(date +%s)
                  local diff=$((current_time - start_time))
                  local min=$((diff / 60))
                  local sec=$((diff % 60))
                  local obj_count
                  obj_count=$(find out -name "*.o" 2>/dev/null | wc -l)

                  local status_txt="<b>🚀 CLMP Build Progress</b>%0A%0A"
                  status_txt+="<b>• Compiler:</b> ${CLANG_DISPLAY}%0A"
                  status_txt+="<b>• Objects Built:</b> ${obj_count}%0A"
                  status_txt+="<b>• Duration:</b> ${min}m ${sec}s%0A"
                  status_txt+="<b>• Status:</b> Compiling..."

                  tg_edit "$msg_id" "$status_txt"
              done
          }

          echo "🚀 Setup Environment..."

          if [[ -d "$KERNEL_DIR" ]]; then rm -rf "$KERNEL_DIR"; fi

          REPO_HOST=$(echo "$KERNEL_REPO_URL" | awk -F/ '{print $3}')
          printf 'machine %s login %s password %s\n' \
              "$REPO_HOST" "$GL_DEPLOY_USER" "$GL_DEPLOY_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

          git clone --quiet --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO_URL" "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo "🔧 Setting up KernelSU..."
          KSU_VERSION=$(curl -s https://api.github.com/repos/backslashxx/KernelSU/releases/latest | jq -r .tag_name)
          echo "📌 Fetching KernelSU Tag: $KSU_VERSION"
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s -- "$KSU_VERSION"

          mkdir -p "$TOOLS_DIR"
          export CCACHE_DIR="/tmp/ccache"
          export USE_CCACHE=1

          if [[ "${CLEAN_BUILD:-false}" == "true" ]]; then
              echo "🧹 Clean Build requested: Clearing Ccache..."
              ccache -C
              ccache -z
          else
              echo "♻️  Using existing Ccache..."
          fi

          ccache -M 10G -o compression=true

          echo "🔧 Setting up Toolchain: ${TOOLCHAIN}..."
          if [[ "$TOOLCHAIN" == "Neutron Clang" ]]; then
              mkdir -p "$NEUTRON_DIR"
              wget -qO "$NEUTRON_DIR/antman" \
                  "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
              chmod +x "$NEUTRON_DIR/antman"
              cd "$NEUTRON_DIR"
              if [[ ! -f "build.info" ]]; then
                  ./antman -S --noprogress
                  ./antman --patch=glibc --noprogress
                  touch .glibc_patched
              else
                  ./antman -U --noconfirm --noprogress || true
                  if [[ ! -f ".glibc_patched" ]]; then
                      ./antman --patch=glibc --noprogress
                      touch .glibc_patched
                  fi
              fi
              cd "$KERNEL_DIR"
              export PATH="$NEUTRON_DIR/bin:$PATH"
          else
              if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
                  echo "⬇️ Downloading Clang $CLANG_VERSION..."
                  mkdir -p "$CLANG_DIR"
                  wget --quiet \
                      "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-$CLANG_VERSION.tar.gz" \
                      -O /tmp/clang.tar.gz
                  tar -xf /tmp/clang.tar.gz -C "$CLANG_DIR"
                  rm -f /tmp/clang.tar.gz
              fi
              export PATH="$CLANG_DIR/bin:$PATH"
          fi

          export ARCH=arm64
          export KBUILD_BUILD_USER="Audemars"
          export KBUILD_BUILD_HOST="ROG-G834JYR"

          CLANG_DISPLAY=$(clang --version | head -n1)

          echo "🔧 Configuring..."
          make O=out "$DEFCONFIG"

          if [[ -f out/.config ]]; then
              RAW_VERSION=$(grep "CONFIG_LOCALVERSION=" out/.config | cut -d'"' -f2 || echo "Kinesis")
              RAW_VERSION="${RAW_VERSION#-}"
              IFS=- read -r KERNEL_VARIANT KERNEL_CODENAME RELEASE_VERSION <<< "$RAW_VERSION"
          fi

          KERNEL_VARIANT=${KERNEL_VARIANT:-"Kinesis"}
          KERNEL_CODENAME=${KERNEL_CODENAME:-"miatoll"}
          RELEASE_VERSION=${RELEASE_VERSION:-"Test"}

          echo "🔥 Starting Compilation..."
          START_TIME=$(date +%s)

          if [[ "${ANALYSIS_TARGET}" == "Power (drivers/power/supply)" ]]; then
              BUILD_TARGET="W=1 drivers/power/supply/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Power Supply")
          elif [[ "${ANALYSIS_TARGET}" == "Display (drivers/gpu/drm/msm)" ]]; then
              BUILD_TARGET="W=1 drivers/gpu/drm/msm/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Display/DRM")
          elif [[ "${ANALYSIS_TARGET}" == "Camera (drivers/media/platform/msm/camera_v2)" ]]; then
              BUILD_TARGET="W=1 drivers/media/platform/msm/camera_v2/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Camera")
          elif [[ "${ANALYSIS_TARGET}" == "Input (drivers/input)" ]]; then
              BUILD_TARGET="W=1 drivers/input/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Input (Touch/FP)")
          elif [[ "${ANALYSIS_TARGET}" == "Audio (techpack/audio)" ]]; then
              BUILD_TARGET="W=1 techpack/audio/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Audio")
          elif [[ "${ANALYSIS_TARGET}" == "Sched/CPU (kernel/sched drivers/cpufreq)" ]]; then
              BUILD_TARGET="W=1 kernel/sched/ drivers/cpufreq/"
              TG_RESPONSE=$(tg_send "🚀 <b>W=1 Build Started</b>%0ATarget: Sched & CPUFreq")
          elif [[ "${ANALYSIS_TARGET}" == "Full Kernel" ]]; then
              BUILD_TARGET="W=1"
              TG_RESPONSE=$(tg_send "🚀 <b>Full W=1 Build Started</b>%0ACompiler: <b>${TOOLCHAIN}</b>%0A<code>${CLANG_DISPLAY}</code>%0AClean Build: <b>${CLEAN_BUILD:-false}</b>")
          else
              BUILD_TARGET=""
              TG_RESPONSE=$(tg_send "🚀 <b>Build Started</b>%0ACompiler: <b>${TOOLCHAIN}</b>%0A<code>${CLANG_DISPLAY}</code>%0AClean Build: <b>${CLEAN_BUILD:-false}</b>")
          fi

          MSG_ID=$(echo "$TG_RESPONSE" | jq -r '.result.message_id // empty' 2>/dev/null || echo "")

          if [[ -n "$MSG_ID" ]]; then
              echo "📡 Live monitoring started (Message ID: $MSG_ID)"
              start_monitor "$MSG_ID" "$START_TIME" &
              MONITOR_PID=$!
          else
              echo "⚠️ Failed to get Message ID. Live updates disabled."
          fi

          if ! make -j"$(nproc)" O=out $BUILD_TARGET \
              CC="ccache clang" \
              HOSTCC=clang \
              HOSTLD=ld.lld \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              STRIP=llvm-strip \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              LLVM=1 \
              LLVM_IAS=1 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              2>&1 | tee build.log; then

              [[ -n "$MSG_ID" ]] && tg_edit "$MSG_ID" "❌ <b>Build Failed</b>%0ACheck attached log."
              tg_doc "$KERNEL_DIR/build.log" "❌ Build log — $(date '+%d/%m/%Y %H:%M')"
              exit 1
          fi

          if [[ "${ANALYSIS_TARGET}" != "None" && "${ANALYSIS_TARGET}" != "Full Kernel" && -n "${ANALYSIS_TARGET}" ]]; then
              [[ -n "$MSG_ID" ]] && tg_edit "$MSG_ID" "✅ <b>Analysis Compile Success</b>%0ACheck GitHub Actions log for warnings."
              tg_doc "$KERNEL_DIR/build.log" "✅ Analysis Build Log — $(date '+%d/%m/%Y %H:%M')"
              exit 0
          fi

          [[ -n "$MSG_ID" ]] && tg_edit "$MSG_ID" "✅ <b>Compilation Done</b>%0APackaging Kernel..."

          echo "📦 Packaging..."
          git clone --quiet --depth=1 -b "$ANYKERNEL_BRANCH" "https://github.com/AzyrRuthless/AnyKernel3" anykernel

          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
              cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
              cp out/arch/arm64/boot/Image.gz anykernel/
          fi

          [[ -f out/arch/arm64/boot/dtbo.img ]] && cp out/arch/arm64/boot/dtbo.img anykernel/
          mkdir -p anykernel/dtb
          find out/arch/arm64/boot/dts/qcom -name "cust-atoll-ab.dtb" -exec cp {} anykernel/dtb/ \;

          TIME_TAG=$(date '+%d%m%Y')
          if [[ -n "$RELEASE_VERSION" && "$RELEASE_VERSION" != "Test" ]]; then
              ZIP_NAME="${PROJECT_NAME}-${KERNEL_VARIANT}-${KERNEL_CODENAME}-${RELEASE_VERSION}-${TIME_TAG}.zip"
          else
              ZIP_NAME="${PROJECT_NAME}-${KERNEL_VARIANT}-${KERNEL_CODENAME}-${TIME_TAG}.zip"
          fi
          ZIP_PATH="$KERNEL_DIR/$ZIP_NAME"

          cd anykernel
          zip -r9 "$ZIP_PATH" . -x "*.git*" "README.md" ".*" >/dev/null
          cd ..

          echo "ARTIFACT_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"

          FINAL_DURATION=$(( ($(date +%s) - START_TIME) / 60 ))m
          [[ -n "$MSG_ID" ]] && tg_edit "$MSG_ID" "✅ <b>Build Success</b>%0A%0A📦 File: <code>$ZIP_NAME</code>%0A⏱ Duration: $FINAL_DURATION"
          tg_doc "$ZIP_PATH" "✅ Build by GitHub Actions"

      - name: ☁️ Upload Artifact to GitHub
        if: ${{ inputs.upload_artifact == true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          compression-level: 0
