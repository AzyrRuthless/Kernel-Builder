name: 🚀 16-SUSFS-KSU

on:
  workflow_dispatch:

jobs:
  build_kernel:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: SUSFSKSU-Kinesis

    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v3
        with:
          # --- Baseband-guard/ ---
          submodules: true 
          # --------------------------------------------------------------------

      - name: 🧰 Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Install Dependencies
        run: |
          echo "🧰 Installing required packages..."
          sudo apt update
          sudo apt install -y git bison flex libxml2 libssl-dev bc zip default-jre python3 python3-pip wget curl aria2 cpio bash ccache jq \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses-dev
          echo "✅ Dependencies installed successfully!"

      - name: 💾 Cache ccache
        uses: actions/cache@v3
        with:
          path: /tmp/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: 🛠️ Build Kernel
        id: build
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          KERNEL_SOURCE: ${{ secrets.KERNEL_SOURCE }}
          KERNEL_BRANCH: 16-KSUN
        run: |
          echo "🚀 Starting the kernel build process..."
          chmod +x sus.sh
          ./sus.sh
          echo "🎉 Kernel build completed!"

      - name: 📤 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: ${{ steps.build.outputs.artifact_dir }}