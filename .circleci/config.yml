version: 2.1

jobs:
  build_kernel:
    working_directory: /home/circleci/project
    docker:
      - image: cimg/base:2025.01
    environment:
      PROJECT_NAME: KSU-Kinesis
      TELEGRAM_CHAT_ID: $TELEGRAM_CHAT_ID
      TELEGRAM_BOT_TOKEN: $TELEGRAM_BOT_TOKEN
      KERNEL_SOURCE: https://github.com/AzyrRuthless/kernel_xiaomi_sm6250
      KERNEL_BRANCH: Next
    steps:
      - checkout

      - run:
          name: 🧰 Setup QEMU
          command: |
            docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - run:
          name: 🐳 Setup Docker Buildx
          command: |
            docker buildx create --use

      - run:
          name: 📦 Install Dependencies
          command: |
            echo "🧰 Installing required packages..."
            sudo apt update
            sudo apt install -y git bison flex libxml2 libssl-dev bc zip default-jre python3 python3-pip wget curl cpio bash ccache jq
            echo "✅ Dependencies installed successfully!"

      - run:
          name: 🛠️ Build Kernel
          command: |
            echo "🚀 Starting the kernel build process..."
            chmod +x Kinesis15.sh
            ./Kinesis15.sh
            echo "🎉 Kernel build completed!"

      - store_artifacts:
          path: /home/circleci/project/Kinesis_Kernel/out/arch/arm64/boot/Image.gz
          destination: Image.gz

      - store_artifacts:
          path: /home/circleci/project/Kinesis_Kernel/out/arch/arm64/boot/dtbo.img
          destination: dtbo.img

      - store_artifacts:
          path: /home/circleci/project/Kinesis_Kernel/out/arch/arm64/boot/dts/qcom/cust-atoll-ab.dtb
          destination: cust-atoll-ab.dtb

      - store_artifacts:
          path: /home/circleci/project/Kinesis_Kernel/*.zip
          destination: kernel.zip

workflows:
  build-workflow:
    jobs:
      - build_kernel