# CircleCI configuration file
# Save this as .circleci/config.yml in your repository root

version: 2.1

# Define the executor environment
executors:
  linux_builder:
    docker:
      - image: cimg/base:current # A modern Ubuntu-based image similar to ubuntu-latest
    working_directory: ~/project

jobs:
  build-kernel:
    executor: linux_builder
    environment:
      # Static environment variables from your GitHub workflow
      PROJECT_NAME: KSU-Kinesis
      KERNEL_SOURCE: https://github.com/AzyrRuthless/kernel_xiaomi_sm6250
      KERNEL_BRANCH: xx
      # Compatibility variable to make xx.sh work without changes
      GITHUB_WORKSPACE: ~/project

    steps:
      - checkout

      - restore_cache:
          keys:
            # Cache key for ccache, based on the contents of the Makefiles
            - v1-ccache-{{ checksum "**/Makefile" }}-{{ checksum "**/Kconfig" }}
            # Fallback to the most recent cache
            - v1-ccache-

      - run:
          name: "Install Dependencies"
          command: |
            echo "Installing required packages..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              git bison flex libxml2-dev libssl-dev bc zip default-jre \
              python3 python3-pip wget curl cpio bash ccache jq
            echo "Dependencies installed successfully!"

      - run:
          name: "Build Kernel"
          command: |
            echo "Starting the kernel build process..."
            chmod +x ./xx.sh
            ./xx.sh
            echo "Kernel build completed!"

      - save_cache:
          key: v1-ccache-{{ checksum "**/Makefile" }}-{{ checksum "**/Kconfig" }}
          paths:
            - /tmp/ccache

      - store_artifacts:
          path: kernel_artifacts
          destination: kernel-artifacts

workflows:
  version: 2
  build_and_deploy:
    jobs:
      - build-kernel
